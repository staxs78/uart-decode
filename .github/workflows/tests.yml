name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run test suite
        run: python test_uart_decode.py
      - name: Smoke-test demo capture
        run: |
          python demo/make_demo_captures.py
          python uart_decode.py demo/uboot_banner_115200_jitter.csv
