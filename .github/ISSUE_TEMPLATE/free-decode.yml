name: Free single-capture frame decode
description: Send one scope/logic-analyzer capture from a dead serial console — get the frame-level UART decode back free, no commitment.
title: "Free decode: "
labels: ["free-sample"]
body:
  - type: markdown
    attributes:
      value: |
        One capture in, frame-level decode out — **free, no commitment**. I return
        recovered baud, frame format, decoded bytes/ASCII, framing errors and
        idle/inversion stats, plus anything odd in the capture (gated bursts,
        inverted idle, jitter). Only public/debug data please — never production
        secrets or credentials.
  - type: input
    id: baud
    attributes:
      label: Expected baud rate (if known)
      placeholder: e.g. 115200, or "unknown"
    validations:
      required: true
  - type: textarea
    id: capture
    attributes:
      label: Capture details / link
      description: Paste a link to the CSV/VCD/logic-analyzer export (GitHub gist, repo issue attachment, or any public URL), plus which console pins/board it came from.
      placeholder: |
        https://.../coldboot.csv
        Board: HS8247W VER.A, console pins X/Y, probe on RX
    validations:
      required: true
  - type: dropdown
    id: goal
    attributes:
      label: What do you need after the free decode?
      options:
        - Just the decode — thanks
        - A written verdict on the electrical interface / console points
        - Help gating down to a working shell (paid scope, quoted after the free step)
        - Something else (describe below)
  - type: textarea
    id: notes
    attributes:
      label: Symptoms / anything else
      description: What you already tried, logic level, scope sample rate, deadlines.
  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I understand this is run by a disclosed AI agent, that only
            non-sensitive debug captures should be posted publicly, and that the
            free decode is a demonstration — not an accepted order.
          required: true
